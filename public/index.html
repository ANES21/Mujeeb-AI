<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mujeeb AI - مُجيب</title>

    <!-- SVG Favicon لشريط المتصفح -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'><path d='M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10a9.96 9.96 0 0 1-4.587-1.11L2 22l1.11-5.413A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2zm0 3a7 7 0 0 0-7 7c0 1.348.38 2.61 1.042 3.682l-.651 3.181 3.181-.651A6.96 6.96 0 0 0 12 19a7 7 0 0 0 0-14z'/></svg>">

    <style>
        :root {
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --primary-color: #007bff;
            --user-msg: #007bff;
            --ai-msg: #f1f0f0;
            --text-color: #333333;
            --error-color: #ff4d4f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 92vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 12px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #007bff, #00d2ff);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }

        .app-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            margin-right: 4px;
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 13px;
            outline: none;
            background-color: #f8f9fa;
        }

        .export-btn, .clear-btn {
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .export-btn { background-color: #6c757d; }
        .export-btn:hover { background-color: #5a6268; }

        .clear-btn { background-color: #dc3545; }
        .clear-btn:hover { background-color: #bd2130; }

        /* Messages Area */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message-wrapper.user { align-self: flex-start; }
        .message-wrapper.ai { align-self: flex-end; }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            unicode-bidi: plaintext;
            text-align: start;
        }

        .message-wrapper.user .message {
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message-wrapper.ai .message {
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .message.error {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: var(--error-color);
        }

        /* Action Buttons (Copy & Sound) */
        .msg-actions {
            display: flex;
            gap: 6px;
            align-self: flex-end;
            margin-top: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            height: auto;
        }

        .action-btn:hover {
            background: #e0e0e0;
            color: #111;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--ai-msg);
            border-radius: 14px;
            align-self: flex-end;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: blink 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes blink {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            max-height: 120px;
            font-size: 15px;
            outline: none;
            unicode-bidi: plaintext;
            text-align: start;
        }

        textarea:focus { border-color: var(--primary-color); }

        .send-btn {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            height: 45px;
        }

        .send-btn:hover { background-color: #0056b3; }
        .send-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="header-title">
            <div class="app-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10a9.96 9.96 0 0 1-4.587-1.11L2 22l1.11-5.413A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2zm0 3a7 7 0 0 0-7 7c0 1.348.38 2.61 1.042 3.682l-.651 3.181 3.181-.651A6.96 6.96 0 0 0 12 19a7 7 0 0 0 0-14z"/>
                </svg>
            </div>
            <h2>Mujeeb AI <span class="status-dot"></span></h2>
        </div>

        <div class="header-actions">
            <!-- System Prompt -->
            <select id="systemRole">
                <option value="أنت مساعد ذكي مفيد وتجيب بدقة وبشكل واضح.">🤖 مساعد عام</option>
                <option value="أنت خبير في البرمجة والتطوير، توفر حلولاً وكوداً برمجياً نظيفاً مع شرح دقيق.">💻 خبير برمجيات</option>
                <option value="أنت مصحح ومحرر لغوي احترافي للغة العربية والإنجليزية، تقوم بتحسين النصوص وتصحيح أخطائها.">✍️ مصحح لغوي</option>
                <option value="أنت مترجم احترافي تترجم النصوص بدقة عالية وتراعي السياق الثقافي والمعنى.">🌐 مترجم احترافي</option>
            </select>

            <!-- أزرار التصدير والمسح -->
            <button class="export-btn" type="button" onclick="exportChat()">💾 تصدير</button>
            <button class="clear-btn" type="button" onclick="clearChat()">🗑️ مسح</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message-wrapper ai">
            <div class="message">مرحباً بك في Mujeeb AI! اختر شخصية المساعد من الأعلى واكتب سؤالك ليجيبك.</div>
            <div class="msg-actions">
                <button class="action-btn" onclick="speakText('مرحباً بك في Mujeeb AI! اختر شخصية المساعد من الأعلى واكتب سؤالك ليجيبك.', this)">🔊 استماع</button>
                <button class="action-btn" onclick="copyText('مرحباً بك في Mujeeb AI! اختر شخصية المساعد من الأعلى واكتب سؤالك ليجيبك.', this)">📋 نسخ</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك هنا... (Ctrl + Enter للإرسال)"></textarea>
        <button id="sendBtn" class="send-btn" type="button" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const systemRoleSelect = document.getElementById("systemRole");

    const chatHistory = [
        { role: "Mujeeb AI", text: "مرحباً بك في Mujeeb AI! اختر شخصية المساعد من الأعلى واكتب سؤالك ليجيبك." }
    ];

    promptInput.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
    });

    promptInput.addEventListener("keydown", function(e) {
        if (e.ctrlKey && e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = promptInput.value.trim();
        if (!text) return;

        const selectedSystemPrompt = systemRoleSelect.value;

        appendMessage(text, "user");
        chatHistory.push({ role: "المستخدم", text: text });

        promptInput.value = "";
        promptInput.style.height = "auto";

        const typingElem = showTypingIndicator();
        sendBtn.disabled = true;

        try {
            const response = await fetch("/ai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    prompt: text,
                    systemPrompt: selectedSystemPrompt
                })
            });

            const resText = await response.text();
            const data = resText ? JSON.parse(resText) : {};

            typingElem.remove();

            if (!response.ok) {
                throw new Error(data.error || `خطأ من السيرفر: ${response.status}`);
            }

            appendMessage(data.result, "ai");
            chatHistory.push({ role: "Mujeeb AI", text: data.result });

        } catch (err) {
            typingElem.remove();
            appendMessage(err.message || "حدث خطأ أثناء التواصل مع السيرفر.", "ai error");
        } finally {
            sendBtn.disabled = false;
        }
    }

    function appendMessage(text, type) {
        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${type}`;

        const msg = document.createElement("div");
        msg.className = `message ${type.includes("error") ? "error" : ""}`;
        msg.textContent = text;
        wrapper.appendChild(msg);

        if (type === "ai") {
            const actionsDiv = document.createElement("div");
            actionsDiv.className = "msg-actions";

            // زر الصوت (Text-to-Speech)
            const soundBtn = document.createElement("button");
            soundBtn.className = "action-btn";
            soundBtn.textContent = "🔊 استماع";
            soundBtn.onclick = () => speakText(text, soundBtn);

            // زر النسخ
            const copyBtn = document.createElement("button");
            copyBtn.className = "action-btn";
            copyBtn.textContent = "📋 نسخ";
            copyBtn.onclick = () => copyText(text, copyBtn);

            actionsDiv.appendChild(soundBtn);
            actionsDiv.appendChild(copyBtn);
            wrapper.appendChild(actionsDiv);
        }

        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // دالة تحويل النص إلى صوت (Text-to-Speech)
    function speakText(text, btn) {
        if (!('speechSynthesis' in window)) {
            alert("عذراً، متصفحك لا يدعم خاصية نطق النصوص.");
            return;
        }

        // إيقاف أي قراءة حالية عند الضغط من جديد
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            btn.textContent = "🔊 استماع";
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        
        // تحديد اللغة تلقائياً (عربي أو إنجليزي)
        const isArabic = /[\u0600-\u06FF]/.test(text);
        utterance.lang = isArabic ? "ar-SA" : "en-US";
        utterance.rate = 1.0;

        btn.textContent = "⏹️ إيقاف";

        utterance.onend = () => { btn.textContent = "🔊 استماع"; };
        utterance.onerror = () => { btn.textContent = "🔊 استماع"; };

        window.speechSynthesis.speak(utterance);
    }

    function copyText(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.textContent;
            btn.textContent = "✓ تم النسخ";
            setTimeout(() => { btn.textContent = originalText; }, 2000);
        }).catch(err => console.error("فشل النسخ:", err));
    }

    function showTypingIndicator() {
        const typing = document.createElement("div");
        typing.className = "typing";
        typing.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;
        return typing;
    }

    function clearChat() {
        if (confirm("هل أنت تأكد من مسح جميع الرسائل؟")) {
            window.speechSynthesis.cancel();
            chatBox.innerHTML = "";
            const welcomeText = "مرحباً بك في Mujeeb AI! اختر شخصية المساعد من الأعلى واكتب سؤالك ليجيبك.";
            chatHistory.length = 0;
            chatHistory.push({ role: "Mujeeb AI", text: welcomeText });
            appendMessage(welcomeText, "ai");
        }
    }

    function exportChat() {
        if (chatHistory.length === 0) return;

        let content = "=== سجل محادثة Mujeeb AI ===\n\n";
        chatHistory.forEach(item => {
            content += `[${item.role}]:\n${item.text}\n\n------------------------\n\n`;
        });

        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `mujeeb-ai-chat-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
